<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AltroAI develops systems and apps, automates business workflows, and helps organizations adopt AI." />
    <title>AltroAI — automations and systems for your business</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.altroai.net/" />

    <!-- Theme color -->
    <meta name="theme-color" content="#faf8f4" />

    <!-- hreflang -->
    <link rel="alternate" hreflang="en" href="https://www.altroai.net/" />
    <link rel="alternate" hreflang="he" href="https://www.altroai.net/he/" />
    <link rel="alternate" hreflang="x-default" href="https://www.altroai.net/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AltroAI" />
    <meta property="og:title" content="AltroAI — automations and systems for your business" />
    <meta property="og:description" content="AltroAI develops systems and apps, automates business workflows, and helps organizations adopt AI." />
    <meta property="og:url" content="https://www.altroai.net" />
    <meta property="og:image" content="https://www.altroai.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AltroAI — automations and systems for your business" />
    <meta name="twitter:description" content="AltroAI develops systems and apps, automates business workflows, and helps organizations adopt AI." />
    <meta name="twitter:image" content="https://www.altroai.net/og-image.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "AltroAI",
        "alternateName": "Altro AI",
        "url": "https://www.altroai.net",
        "logo": "https://www.altroai.net/og-image.png",
        "description": "AltroAI develops systems and apps, automates business workflows, and helps organizations adopt AI.",
        "email": "altroaiteam@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IL"
        },
        "areaServed": "Worldwide",
        "knowsAbout": ["Internal Tools", "Process Automation", "AI Agents", "API Integrations", "Custom Web Applications"]
      }
    </script>

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AltroAI",
        "url": "https://www.altroai.net",
        "inLanguage": ["en", "he"]
      }
    </script>



    <!-- Analytics (self-built, consent-gated) -->
    <script>
      (function () {
        var KEY = 'altro_analytics_consent'
        function load() {
          var s = document.createElement('script')
          s.src = '/track.js'; s.defer = true
          document.head.appendChild(s)
        }
        if (localStorage.getItem(KEY) === 'granted') { load(); return }
        window.__altroLoadAnalytics = load
      })()
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;400;600;800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans+Hebrew:wght@300;400;500;700;800&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
    <script>
      (() => {
        if (location.pathname.startsWith('/admin')) return;
        try {
          if (sessionStorage.getItem('altro_wordmark_intro') === '1') return;
        } catch {}
        document.documentElement.dataset.logoIntro = 'pending';
      })();
    </script>
    <style>
      #logo-intro { display: none; }
      html[data-logo-intro] { background: #faf8f4; }
      html[data-logo-intro] #root { visibility: hidden; }
      html[data-logo-intro] #logo-intro {
        position: fixed; inset: 0; z-index: 10000; display: grid;
        place-items: center; background: #faf8f4;
      }
      #logo-intro .logo-intro__brand { position: relative; width: min(80vw, 460px); }
      #logo-intro img { display: block; width: 100%; height: auto; }
      #logo-intro .logo-intro__base { opacity: .16; }
      #logo-intro .logo-intro__fill { position: absolute; inset: 0; clip-path: inset(0 91% 0 0); }
      html[data-logo-intro="playing"] .logo-intro__fill {
        animation: logo-intro-fill 2.35s cubic-bezier(.25,.7,.3,1) both;
      }
      @keyframes logo-intro-fill { to { clip-path: inset(0); } }
      @media (prefers-reduced-motion: reduce) {
        #logo-intro .logo-intro__fill { clip-path: none; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="logo-intro" aria-hidden="true">
      <div class="logo-intro__brand" dir="ltr">
        <img class="logo-intro__base" src="/altro%20tranparent%20bg.png" alt="" width="2000" height="2000" />
        <img class="logo-intro__fill" src="/altro%20tranparent%20bg.png" alt="" width="2000" height="2000" />
      </div>
    </div>
    <script>
      (() => {
        const html = document.documentElement;
        if (!html.dataset.logoIntro) return;
        const logo = document.querySelector('#logo-intro .logo-intro__fill');
        let ready = false;
        let elapsed = false;
        function reveal() {
          if (!ready || !elapsed) return;
          delete html.dataset.logoIntro;
          try { sessionStorage.setItem('altro_wordmark_intro', '1'); } catch {}
        }
        window.addEventListener('altro:app-ready', () => { ready = true; reveal(); }, { once: true });
        function start() {
          html.dataset.logoIntro = 'playing';
          window.setTimeout(() => { elapsed = true; reveal(); }, 3000);
        }
        if (logo.complete) start();
        else {
          logo.addEventListener('load', start, { once: true });
          logo.addEventListener('error', start, { once: true });
        }
        window.setTimeout(() => { delete html.dataset.logoIntro; }, 15000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
